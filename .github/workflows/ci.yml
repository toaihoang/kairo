name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Kairo.slnx

      - name: Build
        run: dotnet build Kairo.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Kairo.slnx --configuration Release --no-build

      # -warnaserror fails the build on any trim or AOT warning, so the libraries stay reflection-free.
      - name: Publish AOT sample
        run: >
          dotnet publish samples/Kairo.Samples.MinimalApi/Kairo.Samples.MinimalApi.csproj
          --configuration Release --runtime linux-x64 --output aot -warnaserror

      # Runs the native binary: a payload job fails once, is retried, and must succeed on attempt 2.
      - name: Smoke test AOT sample
        run: |
          ./aot/Kairo.Samples.MinimalApi --urls http://localhost:5000 &
          for i in $(seq 1 30); do curl -sf http://localhost:5000/ > /dev/null && break; sleep 1; done
          job_id=$(curl -sf -X POST "http://localhost:5000/welcome?email=retry@example.com" | awk '{print $3}')
          sleep 5
          result=$(curl -sf "http://localhost:5000/jobs/$job_id")
          echo "$result"
          echo "$result" | grep -q "Succeeded, attempt 2"
